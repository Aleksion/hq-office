<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HQ Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23d63c3c%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* One deliberate look: a handheld-era office. Light only. */
:root {
  color-scheme: light;
  --bg: #2b2f45;
  --box: #f8f8f0;
  --ink: #23233a;
  --muted: #6a6a82;
  --edge: #3c3c5a;
  --edge-2: #a8a8c8;
  --red: #d63c3c;
  --amber: #e0901e;
  --green: #2f9e57;
  --blue: #3c6fd6;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --text: "Nunito", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text); }
a { color: var(--blue); }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1680px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

/* the handheld dialog box */
.box { background: var(--box); border: 4px solid var(--edge); border-radius: 10px; box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--edge-2); padding: 14px 16px; min-width: 0; }
.px { font: 10px/1.6 var(--pixel); letter-spacing: .02em; }

/* top bar */
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.stat { display: grid; gap: 6px; padding: 10px 14px; }
.stat .k { font: 8px/1 var(--pixel); color: var(--muted); }
.stat .v { font: 16px/1 var(--pixel); }
.stat.alert .v { color: var(--red); animation: blink 1s steps(2) infinite; }
.stat.ok .v { color: var(--green); }
.title { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.title b { font: 14px/1 var(--pixel); }
.spacer { flex: 1; }
.btn { background: var(--box); border: 3px solid var(--edge); border-radius: 8px; padding: 8px 12px; font: 9px/1 var(--pixel); }
.btn:hover { background: #fff; }
@keyframes blink { 50% { opacity: .35; } }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 14px; align-items: stretch; min-width: 0; }
@media (max-width: 1150px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 14px; min-width: 0; }

/* the room */
.room { padding: 8px; background: #1b1d2c; border: 4px solid var(--edge); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; }
canvas { display: block; width: 100%; max-width: 100%; height: auto; margin: auto; image-rendering: pixelated; border-radius: 4px; cursor: default; }

/* desktop: the page never scrolls. The room takes the height it is given and the panels pack around it. */
@media (min-width: 1151px) {
  body { overflow: hidden; }
  .wrap { height: 100vh; height: 100dvh; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 14px; }
  .main { min-height: 0; }
  .stage { grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .room { min-height: 0; }
  .under { height: clamp(170px, 28dvh, 250px); }
  .under > * { min-height: 0; overflow: auto; }
  .under .log { max-height: none; }
  .hud { min-height: 0; overflow-y: auto; align-content: start; }
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 4px 2px; color: #c8c8e0; font: 8px/1.6 var(--pixel); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-grid; place-items: center; width: 16px; height: 16px; background: #fff; border: 2px solid #23233a; border-radius: 4px; font: 9px/1 var(--pixel); font-style: normal; }

.under { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 800px) { .under { grid-template-columns: minmax(0, 1fr); } }

/* questions */
.hud { display: grid; gap: 12px; }
.hud h2 { margin: 0 0 4px; font: 11px/1.4 var(--pixel); }
.ask { display: grid; gap: 10px; scroll-margin: 12px; }
.ask.flash { animation: flash .9s ease 2; }
@keyframes flash { 50% { box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--red), 0 0 0 4px rgba(214,60,60,.4); } }
.ask .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tag { font: 8px/1 var(--pixel); padding: 5px 7px; border-radius: 4px; background: #e8e8f4; color: var(--ink); border: 0; }
.tag.lane { background: var(--ink); color: #fff; }
.tag.decision { background: #ece0ff; color: #5a2fb0; }
.tag.action { background: #dcebff; color: #1f4fa8; }
.tag.info { background: #eee; }
.timer { margin-left: auto; font: 10px/1 var(--pixel); color: var(--blue); }
.ask.warm .timer { color: var(--amber); }
.ask.hot .timer { color: var(--red); animation: blink 1s steps(2) infinite; }
.due { font: 8px/1 var(--pixel); color: var(--amber); }
.due.late { color: var(--red); }
.ask h3 { margin: 0; font: 800 17px/1.3 var(--text); }
.ask .text { white-space: pre-wrap; overflow-wrap: anywhere; color: #3a3a52; font-size: 14px; }
.codebox { position: relative; margin: 6px 0; background: #e6e6ea; border: 2px solid #c4c4d0; border-radius: 6px; }
.codebox pre { margin: 0; padding: 30px 12px 10px; font: 13px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.copy { position: absolute; top: 6px; right: 6px; font: 8px/1 var(--pixel); padding: 6px 8px; border: 2px solid var(--edge); border-radius: 6px; background: var(--box); }
.copy:hover { background: #fff; }
.menu { display: grid; gap: 2px; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; font: 700 15px/1.3 var(--text); }
.opt::before { content: "▶"; font-size: 11px; color: transparent; }
.opt:hover { background: #eeeef8; }
.opt.sel { background: #e6e6f6; }
.opt.sel::before { color: var(--ink); }
.opt .pick { font: 7px/1 var(--pixel); color: var(--green); }
.reply { display: flex; gap: 8px; flex-wrap: wrap; }
.reply textarea { flex: 1 1 220px; min-width: 0; min-height: 40px; resize: vertical; border: 3px solid var(--edge-2); border-radius: 8px; padding: 8px 10px; font: 14px/1.4 var(--text); background: #fff; color: var(--ink); }
.reply textarea:focus, .compose textarea:focus { outline: none; border-color: var(--edge); }
textarea.dropping { border-color: var(--blue) !important; background: #eef4ff !important; }
.thumb { display: block; max-width: 100%; max-height: 140px; margin-top: 6px; border: 2px solid var(--edge); border-radius: 4px; background: #fff; }
.send { background: var(--red); color: #fff; border: 3px solid #8a2020; border-radius: 8px; padding: 0 14px; min-height: 40px; font: 10px/1 var(--pixel); }
.send.go { background: var(--green); border-color: #1d6b3a; }
.send:disabled { opacity: .35; cursor: not-allowed; }
.empty { font: 9px/1.8 var(--pixel); color: var(--muted); text-align: center; padding: 16px 4px; }

/* worker card */
.card h3 { margin: 0 0 4px; font: 12px/1.4 var(--pixel); }
.card .sub { color: #3a3a52; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.card .note { margin-top: 8px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.status { font: 8px/1 var(--pixel); padding: 5px 7px; border-radius: 4px; color: #fff; }
.compose { display: grid; gap: 8px; }
.compose textarea { width: 100%; min-height: 70px; resize: vertical; border: 3px solid var(--edge-2); border-radius: 8px; padding: 8px 10px; font: 14px/1.4 var(--text); }
.log { display: grid; gap: 6px; margin-top: 10px; max-height: 220px; overflow: auto; }
.log div { font-size: 13px; color: #3a3a52; overflow-wrap: anywhere; }
.log b { font: 7px/1 var(--pixel); color: var(--muted); margin-right: 6px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="box title"><b>HQ OFFICE</b></div>
    <div class="box stat" id="sWait"><span class="k">WAITING ON YOU</span><span class="v">0</span></div>
    <div class="box stat" id="sOld"><span class="k">OLDEST WAIT</span><span class="v">-</span></div>
    <div class="box stat" id="sMove"><span class="k">WORKING</span><span class="v">0</span></div>
    <div class="box stat" id="sHq"><span class="k">WAITING ON HQ</span><span class="v">0</span></div>
    <div class="box stat" id="sBank"><span class="k">₽ BANK TODAY</span><span class="v">1000</span></div>
    <div id="machines" style="display: contents"></div>
    <div class="spacer"></div>
    <button class="btn" id="alerts">SOUND OFF</button>
  </div>

  <div class="main">
    <div class="stage">
      <div class="room">
        <canvas id="room"></canvas>
        <div class="legend">
          <span><i style="color:#d63c3c">!</i>WAITING ON YOU</span>
          <span><i style="color:#e0901e">?</i>WAITING ON HQ</span>
          <span><i style="color:#3c6fd6">…</i>WAITING ON CI/OTHER</span>
          <span><i style="color:#6a6a82">z</i>PARKED</span>
          <span><i style="color:#2f9e57">✓</i>DONE</span>
          <span>AT DESK = WORKING</span>
        </div>
      </div>
      <div class="under">
        <div class="box card" id="card"></div>
        <div class="box">
          <h2 class="px" style="margin:0 0 8px">TELL HQ</h2>
          <form class="compose" id="compose">
            <textarea id="noteText" placeholder="An order, a change of plan, a question. HQ picks it up."></textarea>
            <div class="reply"><button class="send go" type="submit">SEND</button></div>
          </form>
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>
    <div class="hud" id="hud"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const drafts = new Map();
let S = null, seenAsks = null, audio = null, selected = null, hovered = null;
// Set from the server's config on every load: owner name for the room sign, and the links to GitHub and Linear.
let CONFIG = { owner: "", githubRepo: "", linearWorkspace: "" };

const STATUS_TEXT = {
  needs_you: ["Waiting on you", "#d63c3c"],
  hq_turn: ["Waiting on HQ", "#e0901e"],
  stale: ["Waiting on HQ 15+ min", "#c0501e"],
  gone: ["Agent gone", "#6a6a82"],
  moving: ["Working", "#2f9e57"],
  waiting: ["Waiting on CI / other", "#3c6fd6"],
  parked: ["Parked", "#6a6a82"],
  done: ["Done", "#2f9e57"],
};

// ---------- helpers ----------
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function linkify(s) {
  return esc(s)
    .replace(/\[image: ([^\]\s]+)\]/g, (m, p) => { const f = p.split("/").pop(); return `<a href="/uploads/${f}" target="_blank" rel="noopener"><img class="thumb" src="/uploads/${f}" alt=""></a>`; })
    .replace(/https?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + "…" : u}</a>`)
    .replace(/(^|[\s(])#(\d{4,5})\b/g, (m, p, n) => (CONFIG.githubRepo ? `${p}<a href="https://github.com/${CONFIG.githubRepo}/pull/${n}" target="_blank" rel="noopener">#${n}</a>` : m));
}
// Question bodies: text between ``` fences becomes a grey box with a Copy button. The rest is plain text with links.
function renderBody(s) {
  const parts = [];
  let last = 0;
  const fence = /```[^\n]*\n?([\s\S]*?)```/g;
  let m;
  while ((m = fence.exec(s))) {
    parts.push(linkify(s.slice(last, m.index)));
    parts.push(`<div class="codebox"><button class="copy" type="button">COPY</button><pre>${esc(m[1].replace(/\n$/, ""))}</pre></div>`);
    last = fence.lastIndex;
  }
  parts.push(linkify(s.slice(last)));
  return parts.join("");
}
function copyCode(btn) {
  const pre = btn.parentElement.querySelector("pre");
  const done = (ok) => {
    btn.textContent = ok ? "COPIED" : "SELECTED: PRESS CMD-C";
    setTimeout(() => { btn.textContent = "COPY"; }, 1600);
  };
  // Fallback: select the box's text so a plain Cmd-C works.
  const select = () => {
    const range = document.createRange();
    range.selectNodeContents(pre);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    try { return document.execCommand("copy"); } catch { return false; }
  };
  // The write starts inside the click itself, so the browser allows it.
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(pre.textContent).then(() => done(true), () => done(select()));
  else done(select());
}
function dur(ms) {
  ms = Math.max(0, ms);
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d}d${h % 24}h`;
  if (h) return `${h}h${String(m % 60).padStart(2, "0")}`;
  return `${m}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
}
function clock(t) { return new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-hud": "1" }, body: JSON.stringify(body ?? {}) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "box toast px";
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), 2400);
}
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

// ---------- the room ----------
const TS = 16, SC = 3, W = 24, H = 16;
const cv = $("room");
cv.width = W * TS * SC; cv.height = H * TS * SC;
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x * SC), Math.round(y * SC), Math.round(w * SC), Math.round(h * SC)); }

// 16x16 sprites. k outline, h hair, s skin, e eye, c shirt, C shirt shade, p trousers, b shoes.
const HEAD_FRONT = ["................", ".....kkkkkk.....", "....khhhhhhk....", "...khhhhhhhhk...", "...khhhhhhhhk...", "...khsssssshk...", "...ksessssesk...", "...kssssssssk...", "....kssssssk...."];
const HEAD_BACK = ["................", ".....kkkkkk.....", "....khhhhhhk....", "...khhhhhhhhk...", "...khhhhhhhhk...", "...khhhhhhhhk...", "...khhhhhhhhk...", "...khhhhhhhhk...", "....khhhhhhk...."];
const BODY_FRONT = ["....kkcccckk....", "...kcccccccck...", "..ksccccccccsk..", "...kCCCCCCCCk...", "...kppppppppk..."];
const LEGS_FRONT = [["...kppk..kppk...", "...kbbk..kbbk..."], ["...kppk..kpk....", "...kbbk..kk....."]];
const HEAD_SIDE = ["................", ".....kkkkkk.....", "....khhhhhhk....", "...khhhhhhhhk...", "...khhhhhhhhk...", "...khhhhssssk...", "...khhhsssesk...", "...khhssssssk...", "....kssssssk...."];
const BODY_SIDE = ["....kkcccckk....", "....kcccccck....", "....kccsccck....", "....kCCCCCCk....", "....kppppppk...."];
const LEGS_SIDE = [["....kpk..kpk....", "....kbk..kbk...."], [".....kppk.......", ".....kbbk......."]];

function frame(dir, step) {
  // step: 0 stand, 1 and 2 alternate walk frames
  const legsSet = dir === "left" || dir === "right" ? LEGS_SIDE : LEGS_FRONT;
  const legs = step === 0 ? legsSet[0] : legsSet[1];
  const head = dir === "up" ? HEAD_BACK : dir === "down" ? HEAD_FRONT : HEAD_SIDE;
  const body = dir === "left" || dir === "right" ? BODY_SIDE : BODY_FRONT;
  return { rows: [...head, ...body, ...legs], mirror: dir === "left" || (step === 2 && (dir === "up" || dir === "down")) };
}

const HAIR = ["#3b2a20", "#d9a23b", "#a83232", "#2d3f8f", "#6b6b6b", "#e8d27a", "#7b3fa0", "#1f6b5a"];
const SHIRT = ["#e05a4f", "#4f8fe0", "#4fbf6b", "#e0a04f", "#9a5fe0", "#3fb6b0", "#e05fa8", "#5f6fe0", "#c0c040"];
const SKIN = ["#f6d0a8", "#e8b890", "#c08a60", "#8a5a3a"];
const PANTS = ["#3a4a6a", "#4a3a2a", "#2a2a3a", "#5a5a6a"];
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return `rgb(${r},${g},${b})`;
}
function palette(name) {
  const h = hash(name);
  const shirt = SHIRT[h % SHIRT.length];
  return { k: "#22202a", e: "#22202a", h: HAIR[(h >> 4) % HAIR.length], s: SKIN[(h >> 8) % SKIN.length], c: shirt, C: shade(shirt, 0.72), p: PANTS[(h >> 12) % PANTS.length], b: "#2f2f3a" };
}
const NICO = { k: "#22202a", e: "#22202a", h: "#2a1d14", s: "#f0c49c", c: "#d63c3c", C: "#9a2626", p: "#2a2a3a", b: "#2f2f3a" };
const HQBOT = { k: "#22202a", e: "#3ee08f", h: "#7a8696", s: "#c8d2dc", c: "#5aa0d0", C: "#3a7aa8", p: "#5a6a7a", b: "#3a3a48" };

function drawSprite(pal, x, y, dir, step, alpha = 1) {
  const { rows, mirror } = frame(dir, step);
  ctx.globalAlpha = alpha;
  for (let r = 0; r < 16; r++) {
    const row = rows[r];
    for (let c = 0; c < 16; c++) {
      const ch = row[mirror ? 15 - c : c];
      if (ch === "." || !ch) continue;
      px(x + c, y + r, 1, 1, pal[ch]);
    }
  }
  ctx.globalAlpha = 1;
}

// layout, in tiles
const SEATS = [];
for (let row = 0; row < 4; row++) for (let col = 0; col < 7; col++) SEATS.push({ x: 1 + col * 2, y: 4 + row * 3 });
const QUEUE = [];
for (let k = 0; k < 8; k++) QUEUE.push({ x: 20, y: 4 + k });
for (let k = 0; k < 8; k++) QUEUE.push({ x: 21.2, y: 4 + k });
const HQ_SPOT = [[17, 6], [18, 6], [17, 7], [18, 7], [16, 8], [17, 8], [18, 8], [16, 9], [17, 9], [18, 9]].map(([x, y]) => ({ x, y }));
const WAIT_SPOT = [[22, 7], [23, 7], [22, 8], [23, 8], [22, 9], [23, 9], [22, 10], [23, 10]].map(([x, y]) => ({ x, y }));
const COUCH = [17, 18, 19, 20, 21, 22].map((x) => ({ x, y: 13 }));
// The break room: done workers stand by the snack table (x 20 to 22, row 14), and parked ones sit on the couch.
const DONE_SPOT = [16, 17, 18, 19, 16.5, 17.5, 18.5, 19.5].map((x, i) => ({ x, y: i < 4 ? 14.6 : 15.2 }));
function slot(list, i) { const s = list[i % list.length]; const lap = Math.floor(i / list.length); return { x: s.x + lap * 0.3, y: s.y + lap * 0.2 }; }

const workers = new Map(); // name -> { x, y, path, dir, step, t, lane, seat, pal, bob }

function targetFor(lane, i, counts) {
  const st = lane.status;
  if (st === "needs_you") return { at: slot(QUEUE, counts.queue++), face: "up" };
  if (st === "hq_turn" || st === "stale") return { at: slot(HQ_SPOT, counts.hq++), face: "left" };
  if (st === "waiting") return { at: slot(WAIT_SPOT, counts.wait++), face: "down" };
  if (st === "parked") return { at: slot(COUCH, counts.couch++), face: "down" };
  if (st === "done") return { at: slot(DONE_SPOT, counts.done++), face: "down" };
  return { at: SEATS[i % SEATS.length], face: "up" }; // moving or gone: at the desk
}

// ---------- collision ----------
// Furniture a worker cannot walk through, in tiles. Desks count only while they are drawn.
const FURNITURE = [];
for (let x = 17; x <= 22; x++) for (const y of [2, 3, 12, 13]) FURNITURE.push([x, y]); // Nico's counter, the couch
FURNITURE.push([16, 4], [16, 5], [23, 5], [23, 6], [0, 2], [14, 2], [15, 15]); // HQ terminal, coffee machine, plants
for (const x of [20, 21, 22]) FURNITURE.push([x, 14]); // the snack table
FURNITURE.push([23, 14], [23, 15]); // the kitchen coffee machine
let blocked = new Set();
const tileKey = (x, y) => `${x},${y}`;
function rebuildBlocked(n) {
  blocked = new Set(FURNITURE.map(([x, y]) => tileKey(x, y)));
  for (const s of SEATS.slice(0, deskCount(n))) blocked.add(tileKey(s.x, s.y - 1)); // the desk sits in front of its seat
}
// Breadth-first search over free tiles. Waypoints from `from` to `to`, or null when no way exists.
function findPath(from, to) {
  const sx = Math.round(from.x), sy = Math.round(from.y), gx = Math.round(to.x), gy = Math.round(to.y);
  const came = new Map([[tileKey(sx, sy), null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    if (x === gx && y === gy) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = tileKey(nx, ny);
      if (nx < 0 || nx >= W || ny < 2 || ny >= H || came.has(k)) continue;
      if (blocked.has(k) && !(nx === gx && ny === gy)) continue;
      came.set(k, [x, y]);
      queue.push([nx, ny]);
    }
  }
  if (!came.has(tileKey(gx, gy))) return null;
  const tiles = [];
  for (let p = [gx, gy]; came.get(tileKey(p[0], p[1])); p = came.get(tileKey(p[0], p[1]))) tiles.unshift({ x: p[0], y: p[1] });
  return [...tiles, { x: to.x, y: to.y }];
}

function route(from, to) {
  const around = findPath(from, to);
  if (around) return around;
  const pts = [];
  if (Math.abs(from.y - to.y) > 0.01) {
    const cx = (x) => (x >= 15 ? x : Math.round(x / 2) * 2);
    pts.push({ x: cx(from.x), y: from.y }, { x: cx(from.x), y: to.y });
  }
  pts.push({ x: to.x, y: to.y });
  return pts;
}

function deskCount(n) { return Math.min(SEATS.length, Math.max(14, Math.ceil(n / 7) * 7)); }

function syncWorkers(initial) {
  const lanes = S.lanes;
  const names = new Set(lanes.map((l) => l.name));
  for (const n of [...workers.keys()]) if (!names.has(n)) workers.delete(n);
  rebuildBlocked(lanes.length);
  // queue order: oldest open ask first
  const oldest = new Map();
  for (const a of S.open) if (a.lane) oldest.set(a.lane, Math.min(oldest.get(a.lane) ?? Infinity, a.created_at));
  const ordered = [...lanes].sort((a, b) => (oldest.get(a.name) ?? Infinity) - (oldest.get(b.name) ?? Infinity) || a.name.localeCompare(b.name));
  const seatIndex = new Map([...lanes].sort((a, b) => a.name.localeCompare(b.name)).map((l, i) => [l.name, i]));
  const counts = { queue: 0, hq: 0, wait: 0, couch: 0, done: 0 };
  for (const lane of ordered) {
    const seat = seatIndex.get(lane.name);
    const { at, face } = targetFor(lane, seat, counts);
    let w = workers.get(lane.name);
    if (!w) {
      w = { x: at.x, y: at.y, path: [], dir: face, step: 0, t: 0, pal: palette(lane.name), bob: hash(lane.name) % 1000 };
      workers.set(lane.name, w);
    }
    if (!isIdle(lane)) w.brain = null;
    if (w.brain) { w.lane = lane; continue; } // the break room decides where idle workers go
    const prevTarget = w.target;
    w.lane = lane;
    w.seat = SEATS[seat % SEATS.length];
    w.face = face;
    w.target = at;
    if (initial) { w.x = at.x; w.y = at.y; w.dir = face; w.path = []; }
    else if (!prevTarget || prevTarget.x !== at.x || prevTarget.y !== at.y) w.path = route(w, at);
    if (isIdle(lane)) w.brain = { nextAt: 0, act: null, acting: false, until: 0 };
  }
}

function drawRoom(now) {
  // floor
  for (let y = 2; y < H; y++) for (let x = 0; x < W; x++) {
    const office = x >= 15;
    const a = office ? "#cfe0e6" : "#eadfc4", b = office ? "#c3d6de" : "#e0d3b4";
    px(x * TS, y * TS, TS, TS, (x + y) % 2 ? a : b);
  }
  px(15 * TS - 1, 2 * TS, 2, (H - 2) * TS, "#9fb3bd");
  // wall
  px(0, 0, W * TS, 2 * TS, "#7d8fb0");
  px(0, 2 * TS - 4, W * TS, 4, "#56688a");
  for (const wx of [2, 7, 12]) {
    px(wx * TS, 4, TS * 2, 18, "#3c4a68");
    px(wx * TS + 2, 6, TS * 2 - 4, 14, "#a9d8f5");
    px(wx * TS + TS - 1, 6, 2, 14, "#3c4a68");
  }
  // HQ sign on the office wall
  px(17 * TS, 5, 6 * TS, 18, "#2b2f45");
  ctx.fillStyle = "#f8f8f0";
  ctx.font = `${8 * SC}px "Press Start 2P", monospace`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(CONFIG.owner ? `${CONFIG.owner.toUpperCase()}'S DESK` : "YOUR DESK", 20 * TS * SC, 14 * SC);
  // plants
  for (const [x, y] of [[0, 2], [14, 2], [15.2, 15]]) {
    px(x * TS + 4, y * TS + 8, 8, 7, "#a0603c");
    px(x * TS + 2, y * TS, 12, 9, "#3f9e4f");
    px(x * TS + 5, y * TS - 3, 6, 5, "#57b866");
  }
  // desks with monitors
  const atDesk = new Set([...workers.values()].filter((w) => w.lane.status === "moving" && Math.abs(w.x - w.target.x) < 0.05 && Math.abs(w.y - w.target.y) < 0.05).map((w) => `${w.seat.x},${w.seat.y}`));
  const used = deskCount(workers.size);
  for (const s of SEATS.slice(0, used)) {
    const dx = s.x * TS, dy = (s.y - 1) * TS;
    px(dx - 2, dy + 7, TS + 4, 8, "#9a6a3a");
    px(dx - 2, dy + 14, TS + 4, 2, "#6e4826");
    px(dx + 3, dy - 1, 10, 8, "#2b2f3a");
    const on = atDesk.has(`${s.x},${s.y}`);
    px(dx + 4, dy, 8, 6, on ? "#6ad1ff" : "#3b4a5a");
    if (on) {
      const f = Math.floor(now / 180 + s.x * 3 + s.y) % 4;
      px(dx + 5, dy + 1, 2 + f, 1, "#ffffff");
      px(dx + 5, dy + 3, 5 - f, 1, "#ffffff");
    }
  }
  // HQ terminal
  px(16 * TS, 4 * TS + 2, TS, 14, "#1d2733");
  px(16 * TS + 2, 4 * TS + 4, TS - 4, 8, "#163a2a");
  const g = Math.floor(now / 250) % 3;
  px(16 * TS + 3, 4 * TS + 5 + g * 2, 8, 1, "#3ee08f");
  // coffee machine
  px(23 * TS + 2, 6 * TS - 4, 12, 16, "#55555f");
  px(23 * TS + 4, 6 * TS - 2, 8, 5, "#2a2a30");
  px(23 * TS + 11, 6 * TS + 6, 2, 2, Math.floor(now / 500) % 2 ? "#ff4d4d" : "#802020");
  // couch
  px(17 * TS - 2, 12 * TS + 10, 6 * TS + 4, 8, "#7a4fa0");
  px(17 * TS - 2, 13 * TS + 2, 6 * TS + 4, 9, "#9466bd");
  px(17 * TS - 4, 12 * TS + 12, 4, 14, "#5e3a80");
  px(23 * TS, 12 * TS + 12, 4, 14, "#5e3a80");
  // kitchen coffee machine, steaming, beside the snack table
  px(23 * TS + 3, 14 * TS, 10, 16, "#55555f");
  px(23 * TS + 5, 14 * TS + 2, 6, 4, "#2a2a30");
  px(23 * TS + 12, 14 * TS + 9, 2, 2, Math.floor(now / 500) % 2 ? "#ff4d4d" : "#802020");
  for (let i = 0; i < 3; i++) px(23 * TS + 6 + i * 2, 14 * TS - 4 - ((now / 260 + i * 3) % 6), 2, 2, "#e8e8f0");
  // snack table: chips, a can, a donut and an apple on a wooden top
  px(20 * TS, 14 * TS + 4, 3 * TS, 8, "#c98f4a");
  px(20 * TS, 14 * TS + 12, 3 * TS, 2, "#8a5a2a");
  px(20 * TS + 3, 14 * TS - 2, 6, 6, "#e0c040");
  px(20 * TS + 14, 14 * TS - 2, 5, 6, "#3c6fd6");
  px(20 * TS + 27, 14 * TS - 2, 6, 6, "#ff8fab");
  px(20 * TS + 36, 14 * TS - 1, 5, 5, "#d63c3c");
}

function drawBubble(x, y, glyph, color, bounce) {
  const bx = x + 9, by = y - 9 - bounce;
  px(bx, by, 10, 9, "#22202a");
  px(bx + 1, by + 1, 8, 7, "#ffffff");
  px(bx + 2, by + 9, 2, 2, "#22202a");
  ctx.fillStyle = color;
  ctx.font = `bold ${7 * SC}px "Press Start 2P", monospace`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(glyph, (bx + 5) * SC, (by + 5) * SC);
}

function drawLabel(text, cx, y, strong) {
  ctx.font = `${strong ? 700 : 600} ${4.2 * SC}px Nunito, system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = strong ? "rgba(35,35,58,.92)" : "rgba(35,35,58,.62)";
  ctx.fillRect(cx * SC - w / 2, y * SC, w, 5.6 * SC);
  ctx.fillStyle = "#fff";
  ctx.fillText(text, cx * SC, y * SC + 0.8 * SC);
}

const GLYPH = { needs_you: ["!", "#d63c3c"], hq_turn: ["?", "#e0901e"], stale: ["?", "#c0501e"], waiting: ["…", "#3c6fd6"], parked: ["z", "#6a6a82"], done: ["✓", "#2f9e57"], gone: ["x", "#6a6a82"] };

// One routine of 30 beats, looping. Each move: facing, walk frame, sideways offset in pixels, how he moves
// ("bob", "hop", "still" or "slide"), and whether sparkles fly. The routine is side steps, hops, a spin, a back hop,
// a shuffle, and a moonwalk that travels left, turns, travels right, turns, and comes back to the middle. He always
// slides backwards: side-on, facing the way he is not going. A slide's offset is a [from, to] pair of pixels.
const BEAT_MS = 360;
const DANCE = [
  ["down", 0, 0, "bob", false], ["down", 1, 0, "bob", false],
  ["left", 1, -4, "bob", false], ["left", 0, -4, "still", false],
  ["right", 1, 4, "bob", false], ["right", 0, 4, "still", false],
  ["down", 0, 0, "hop", true], ["down", 1, 0, "hop", true],
  ["right", 1, 0, "bob", false], ["down", 1, 0, "bob", false], ["left", 1, 0, "bob", false], ["up", 1, 0, "bob", false],
  ["up", 0, 0, "hop", true], ["down", 0, -2, "bob", false], ["down", 0, 2, "bob", false], ["up", 0, 0, "hop", true],
  // The moonwalk: left, turn, right, turn, back to the middle, face the room, hold
  ["right", 0, [0, -4], "slide", false], ["right", 1, [-4, -8], "slide", false],
  ["left", 0, -8, "still", false],
  ["left", 0, [-8, -4], "slide", false], ["left", 1, [-4, 0], "slide", false],
  ["left", 0, [0, 4], "slide", false], ["left", 1, [4, 8], "slide", false],
  ["right", 0, 8, "still", false],
  ["right", 1, [8, 6], "slide", false], ["right", 0, [6, 4], "slide", false],
  ["right", 1, [4, 2], "slide", false], ["right", 0, [2, 0], "slide", false],
  ["down", 0, 0, "still", false], ["down", 0, 0, "still", false],
];
// Where Nico is on the routine right now: the move, how far he is off the ground (0 to 1), and his lift in pixels.
function danceMove(now) {
  const beat = Math.floor(now / BEAT_MS) % DANCE.length;
  const frac = (now % BEAT_MS) / BEAT_MS;
  const [dir, step, offset, kind, sparkle] = DANCE[beat];
  const travel = Array.isArray(offset) ? offset[0] + (offset[1] - offset[0]) * frac : offset;
  const arc = Math.abs(Math.sin(frac * Math.PI));
  const air = kind === "hop" ? arc : 0;
  const lift = kind === "bob" ? -3 * arc : kind === "hop" ? -8 * arc : 0;
  return {
    dir, step,
    dx: Math.round(travel),
    dy: 0,
    air, lift: Math.round(lift), sparkle: sparkle && frac < 0.6,
  };
}
// A soft shadow under his feet, smaller the higher he is and following him sideways.
function drawShadow(air, dx) {
  ctx.globalAlpha = 0.25 - air * 0.1;
  ctx.fillStyle = "#22202a";
  ctx.beginPath();
  ctx.ellipse((20 * TS + dx) * SC, (2 * TS + 11) * SC, (5 - air * 1.5) * SC, 1.6 * SC, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}
// Sparkles that fly off his head on the hops.
function drawSparkles(now) {
  const colors = ["#ffd166", "#9fe3ff", "#ff8fab"];
  for (let i = 0; i < 4; i++) {
    const a = (now / 120 + i * 1.6) % (Math.PI * 2);
    px(20 * TS + 6 + Math.cos(a) * 14, 2 * TS - 4 + Math.sin(a) * 6, 1, 1, colors[i % colors.length]);
  }
}
// Music notes float up off Nico's head while he dances.
function drawNotes(now) {
  for (let i = 0; i < 2; i++) {
    const t = ((now + i * 600) % 1200) / 1200;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = i ? "#ffd166" : "#9fe3ff";
    ctx.font = `${5 * SC}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(i ? "♫" : "♪", (20 * TS + 14 + i * 12 - 6 * t) * SC, (2 * TS - 4 - t * 22) * SC);
  }
  ctx.globalAlpha = 1;
}

// ---------- break room life ----------
// Idle workers (done or parked) live their own life here. They wander, sip coffee at the kitchen, grab a snack,
// or pair up and face each other, nodding. Nobody says anything; the movement and the gestures carry it.
const COFFEE_SPOT = { x: 22, y: 15 }; // beside the kitchen coffee machine, facing it
const SNACK_SPOT = { x: 20, y: 15 };  // below the snack table, facing it
const WANDER = [[16, 13], [16, 14], [17, 14], [18, 14], [19, 14], [16, 15], [17, 15], [18, 15], [19, 15], [14, 13], [14, 14], [14, 15], [15, 13], [15, 14], [15, 15]];
const CHAT_PAIRS = [[[16, 14], [17, 14]], [[18, 14], [19, 14]], [[16, 15], [17, 15]], [[18, 15], [19, 15]]]; // left, right
const SNACK_COLORS = ["#e0c040", "#3c6fd6", "#ff8fab", "#d63c3c"];
const isIdle = (lane) => lane.status === "done" || lane.status === "parked";
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
const spotOf = ([x, y]) => ({ x, y });
// A tile is taken when another worker is headed for it or standing on it.
function taken([x, y], self) {
  for (const o of workers.values()) {
    if (o === self || !o.target) continue;
    if (Math.round(o.target.x) === x && Math.round(o.target.y) === y) return true;
  }
  return false;
}
function openSpot(list, self) {
  const free = list.filter((p) => !taken(p, self));
  return free.length ? pickOne(free) : null;
}
function sendTo(w, spot, act) {
  w.brain.act = act;
  w.brain.acting = false;
  w.target = spot;
  w.path = route(w, spot);
}
function idleBrain(w, now, all) {
  const b = w.brain;
  if (w.path.length) return; // still walking
  if (b.act && !b.acting) { b.acting = true; b.until = now + b.act.dur; w.face = b.act.face; }
  if (b.acting) {
    if (now >= b.until) { b.act = null; b.acting = false; b.nextAt = now + 800 + Math.random() * 2500; }
    return;
  }
  if (now < b.nextAt) return;
  const partners = all.filter((o) => o !== w && o.brain && !o.brain.act && o.path.length === 0 && isIdle(o.lane) && Math.hypot(o.x - w.x, o.y - w.y) < 9);
  const roll = Math.random();
  const pairs = CHAT_PAIRS.filter(([l, r]) => !taken(l, w) && !taken(r, w));
  if (partners.length && pairs.length && roll < 0.35) {
    const [left, right] = pickOne(pairs);
    const dur = 4000 + Math.random() * 3000;
    sendTo(w, spotOf(left), { kind: "chat", dur, face: "right" });
    sendTo(pickOne(partners), spotOf(right), { kind: "chat", dur, face: "left" });
  } else if (roll < 0.6 && !taken([COFFEE_SPOT.x, COFFEE_SPOT.y], w)) sendTo(w, COFFEE_SPOT, { kind: "coffee", dur: 3500 + Math.random() * 1500, face: "right" });
  else if (roll < 0.8 && !taken([SNACK_SPOT.x, SNACK_SPOT.y], w)) sendTo(w, SNACK_SPOT, { kind: "snack", dur: 2500 + Math.random() * 1500, face: "up" });
  else {
    const spot = openSpot(WANDER, w);
    if (spot) sendTo(w, spotOf(spot), { kind: "stand", dur: 1500 + Math.random() * 2500, face: pickOne(["down", "left", "right"]) });
    else b.nextAt = now + 1500; // nowhere free right now: try again shortly
  }
}
// Body movement while idle: a waddle when walking, a nod when chatting, a sip or a munch when eating.
function idleLift(w, moving, now) {
  const b = w.brain;
  if (!b) return 0;
  if (moving) return Math.abs(Math.sin(now / 110 + w.bob)) > 0.5 ? -1 : 0;
  if (!b.acting) return 0;
  if (b.act.kind === "chat") return Math.floor(now / 350 + w.bob) % 2 ? -1 : 0;
  if (b.act.kind === "coffee") return Math.floor(now / 700) % 2 ? -1 : 0;
  if (b.act.kind === "snack") return Math.floor(now / 500) % 2 ? -1 : 0;
  return 0;
}
// A waiting worker checks his watch now and then: a faint glint on the wrist for a moment, then nothing.
// Each worker has his own timing, from his name.
function drawWatchCheck(w, sx, sy, now) {
  if ((now + w.bob * 37) % 9000 > 1400) return;
  if (Math.floor(now / 140) % 2) px(sx + 13, sy + 12, 2, 2, "#ffffff");
}
// What is in his hand while he eats or drinks.
function drawProp(w, sx, sy) {
  const b = w.brain;
  if (!b || !b.acting) return;
  if (b.act.kind === "coffee") { px(sx + 12, sy + 8, 4, 1, "#3a2a20"); px(sx + 12, sy + 9, 4, 4, "#f8f8f0"); }
  if (b.act.kind === "snack") px(sx + 12, sy + 9, 4, 4, SNACK_COLORS[w.bob % SNACK_COLORS.length]);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawRoom(now);
  if (S) {
    // Nico behind the counter, HQ at its terminal
    // With nothing waiting on him, Nico dances the routine, and music notes float up while he does.
    const dancing = !S.open.length;
    const move = dancing ? danceMove(now) : null;
    if (move) drawShadow(move.air, move.dx);
    drawSprite(NICO, 20 * TS - 8 + (move?.dx ?? 0), 2 * TS - 6 + (move?.lift ?? 0), move?.dir ?? "down", move?.step ?? 0);
    if (move?.sparkle) drawSparkles(now);
    if (dancing) drawNotes(now);
    px(17 * TS, 3 * TS - 2, 6 * TS, 10, "#c84b4b");
    px(17 * TS, 3 * TS - 2, 6 * TS, 3, "#f08080");
    px(17 * TS, 3 * TS + 8, 6 * TS, 3, "#8a2a2a");
    drawLabel("YOU", 20 * TS, 3 * TS + 10, true);
    drawSprite(HQBOT, 16 * TS, 5 * TS - 6, "up", 0);
    drawLabel("HQ", 16 * TS + 8, 5 * TS + 10, true);

    const list = [...workers.values()];
    for (const w of list) if (w.brain) idleBrain(w, now, list);
    for (const w of list) {
      if (w.path.length) {
        const p = w.path[0];
        const dx = p.x - w.x, dy = p.y - w.y;
        const d = Math.hypot(dx, dy), step = 4.5 * dt;
        if (d <= step) { w.x = p.x; w.y = p.y; w.path.shift(); }
        else { w.x += (dx / d) * step; w.y += (dy / d) * step; }
        w.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up";
        w.t += dt;
      } else {
        w.dir = w.face;
        w.t = 0;
      }
    }
    list.sort((a, b) => a.y - b.y);
    for (const w of list) {
      const moving = w.path.length > 0;
      const step = moving ? 1 + (Math.floor(w.t * 8) % 2) : 0;
      const st = w.lane.status;
      const idleBob = !moving && st === "moving" ? (Math.floor((now + w.bob * 7) / 300) % 2) : 0;
      const ghost = st === "gone";
      const float = ghost ? Math.sin(now / 400 + w.bob) * 1.5 : 0;
      const sway = w.brain && moving ? Math.round(Math.sin(now / 110 + w.bob)) : 0;
      const sx = w.x * TS + sway, sy = w.y * TS - 6 - idleBob + float - idleLift(w, moving, now);
      if (selected === w.lane.name) {
        const r = 7 + Math.sin(now / 200);
        ctx.strokeStyle = "#d63c3c";
        ctx.lineWidth = SC;
        ctx.beginPath();
        ctx.ellipse((sx + 8) * SC, (w.y * TS + 9) * SC, r * SC, r * 0.45 * SC, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawSprite(w.pal, sx, sy, w.dir, step, ghost ? 0.4 : 1);
      if (!moving && GLYPH[st]) {
        const bounce = st === "needs_you" ? Math.abs(Math.sin(now / 220)) * 2.5 : 0;
        drawBubble(sx, sy, GLYPH[st][0], GLYPH[st][1], bounce);
      }
      drawProp(w, sx, sy);
      if (st === "waiting" && !moving) drawWatchCheck(w, sx, sy, now);
      const name = w.lane.name.length > 14 ? w.lane.name.slice(0, 13) + "…" : w.lane.name;
      drawLabel(name, sx + 8, w.y * TS + 10, selected === w.lane.name || hovered === w.lane.name || st === "needs_you");
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function workerAt(e) {
  const r = cv.getBoundingClientRect();
  const nx = ((e.clientX - r.left) / r.width) * W * TS, ny = ((e.clientY - r.top) / r.height) * H * TS;
  let hit = null;
  for (const w of workers.values()) {
    const sx = w.x * TS, sy = w.y * TS - 6;
    if (nx >= sx + 2 && nx <= sx + 14 && ny >= sy && ny <= sy + 22) if (!hit || w.y > hit.y) hit = w;
  }
  return hit;
}
cv.addEventListener("mousemove", (e) => { const w = workerAt(e); hovered = w?.lane.name ?? null; cv.style.cursor = w ? "pointer" : "default"; });
cv.addEventListener("mouseleave", () => { hovered = null; });
cv.addEventListener("click", (e) => {
  const w = workerAt(e);
  if (!w) return;
  select(w.lane.name, true);
});

function select(name, jump) {
  selected = name;
  renderCard();
  if (jump) {
    const card = document.querySelector(`.ask[data-lane="${CSS.escape(name)}"]`);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
  }
}

// Desktop: the canvas is as big as the room box allows, keeping its 3:2 shape, so the page never scrolls.
const roomBox = cv.parentElement, roomLegend = roomBox.querySelector(".legend");
function fitRoom() {
  if (!matchMedia("(min-width: 1151px)").matches) { cv.style.width = ""; return; }
  const w = roomBox.clientWidth - 16;
  const h = roomBox.clientHeight - 16 - roomLegend.offsetHeight;
  cv.style.width = Math.max(160, Math.floor(Math.min(w, (h * W) / H))) + "px";
}
new ResizeObserver(fitRoom).observe(roomBox);

// ---------- HUD ----------
// One box per machine: CPU busy and memory used, from the last sample. Red past 90% on either.
function renderMachines() {
  $("machines").innerHTML = (S.machines ?? []).map(({ machine, sample, age, ok }) => {
    const name = esc(machine.toUpperCase());
    if (!sample) return `<div class="box stat"><span class="k">${name}</span><span class="v">-</span></div>`;
    const bad = ok && (sample.cpu_busy > 90 || sample.mem_used > 90);
    const state = bad ? "alert" : ok ? "ok" : "";
    const value = ok ? `${Math.round(sample.cpu_busy)}% · ${Math.round(sample.mem_used)}%` : "OFFLINE";
    const tip = sample.ok ? `load ${sample.load1.toFixed(1)} on ${sample.cores} cores, sampled ${dur(age)} ago` : `last sample failed: ${sample.error ?? "unknown"}`;
    return `<div class="box stat ${state}" title="${esc(tip)}"><span class="k">${name} CPU · MEM</span><span class="v">${value}</span></div>`;
  }).join("");
}

function renderStats() {
  renderMachines();
  const n = S.open.length;
  const sw = $("sWait");
  sw.className = "box stat " + (n ? "alert" : "ok");
  sw.querySelector(".v").textContent = n;
  const oldest = n ? Math.min(...S.open.map((a) => a.created_at)) : null;
  $("sOld").querySelector(".v").textContent = oldest ? dur(Date.now() - oldest) : "-";
  const live = S.lanes.filter((l) => !["done", "parked"].includes(l.status));
  $("sMove").querySelector(".v").textContent = `${S.lanes.filter((l) => l.status === "moving").length}/${live.length}`;
  $("sHq").querySelector(".v").textContent = S.lanes.filter((l) => ["hq_turn", "stale", "gone"].includes(l.status)).length;
  $("sBank").querySelector(".v").textContent = S.score.bank;
  document.title = n ? `(${n}) HQ Office` : "HQ Office";
}

function renderHud() {
  const hud = $("hud");
  const focused = document.activeElement?.closest?.("[data-ask]")?.dataset.ask;
  const caret = document.activeElement?.selectionStart;
  const head = `<div class="box"><h2>${S.open.length ? `${S.open.length} WAITING ON YOU` : "NOTHING WAITS ON YOU"}</h2><div style="color:var(--muted);font-size:14px">${S.open.length ? "Answer here. The worker in the queue walks back to its desk once HQ acts." : "Every worker is either at its desk or waiting on HQ or CI."}</div></div>`;
  hud.innerHTML = head + S.open.map((a) => {
    const d = drafts.get(a.id) || {};
    const kind = a.kind;
    const canSend = kind !== "decision" || d.opt || (d.text || "").trim();
    const opts = a.options.map((o) => `<button class="opt ${d.opt === o ? "sel" : ""}" data-opt="${esc(o)}">${esc(o)}${a.recommended === o ? ` <span class="pick">HQ PICK</span>` : ""}</button>`).join("");
    return `<article class="box ask" data-ask="${a.id}" data-lane="${esc(a.lane || "")}" data-created="${a.created_at}" data-due="${a.due || ""}">
      <div class="meta">
        ${a.lane ? `<button class="tag lane" data-select="${esc(a.lane)}">${esc(a.lane)}</button>` : ""}
        <span class="tag ${esc(kind)}">${esc(kind.toUpperCase())}</span>
        ${a.link ? `<a class="tag" href="${esc(a.link)}" target="_blank" rel="noopener">OPEN LINK</a>` : ""}
        <span class="due"></span>
        <span class="timer"></span>
      </div>
      <h3>${linkify(a.title)}</h3>
      ${a.body ? `<div class="text">${renderBody(a.body)}</div>` : ""}
      ${opts ? `<div class="menu">${opts}</div>` : ""}
      <div class="reply">
        <textarea rows="1" placeholder="${kind === "action" ? "Optional note for HQ" : a.options.length ? "Add detail, or answer in your own words" : "Your answer"}">${esc(d.text || "")}</textarea>
        <button class="send ${kind !== "decision" ? "go" : ""}" ${canSend ? "" : "disabled"}>${kind === "action" ? "DONE" : kind === "info" ? "OK" : "SEND"}</button>
      </div>
    </article>`;
  }).join("");
  if (focused) {
    const ta = hud.querySelector(`[data-ask="${focused}"] textarea`);
    if (ta) { ta.focus(); if (caret != null) ta.setSelectionRange(caret, caret); }
  }
  tick();
}

function renderCard() {
  const card = $("card");
  const lane = S?.lanes.find((l) => l.name === selected);
  if (!lane) {
    card.innerHTML = `<h3>CLICK A WORKER</h3><div class="sub">Each worker is one lane. Click one to see what it does, where it is, and what it waits on.</div>`;
    return;
  }
  const [label, color] = STATUS_TEXT[lane.status] || [lane.status, "#6a6a82"];
  const asks = S.open.filter((a) => a.lane === lane.name);
  const links = [
    ...(lane.issue && CONFIG.linearWorkspace ? lane.issue.split(/[ ,]+/).filter(Boolean).map((i) => `<a class="tag" href="https://linear.app/${esc(CONFIG.linearWorkspace)}/issue/${esc(i)}" target="_blank" rel="noopener">${esc(i)}</a>`) : []),
    ...(lane.pr && CONFIG.githubRepo ? String(lane.pr).split(/[ ,]+/).filter(Boolean).map((p) => `<a class="tag" href="https://github.com/${CONFIG.githubRepo}/pull/${esc(p.replace("#", ""))}" target="_blank" rel="noopener">#${esc(p.replace("#", ""))}</a>`) : []),
    ...(lane.issue && !CONFIG.linearWorkspace ? lane.issue.split(/[ ,]+/).filter(Boolean).map((i) => `<span class="tag">${esc(i)}</span>`) : []),
    ...(lane.pr && !CONFIG.githubRepo ? String(lane.pr).split(/[ ,]+/).filter(Boolean).map((p) => `<span class="tag">#${esc(p.replace("#", ""))}</span>`) : []),
    lane.machine ? `<span class="tag">${esc(lane.machine)} ${esc(lane.pane || "")}</span>` : "",
  ].join("");
  card.innerHTML = `<h3>${esc(lane.name)}</h3>
    <div class="sub">${esc(lane.title || "")}</div>
    <div class="row"><span class="status" style="background:${color}">${esc(label.toUpperCase())}</span>${lane.herdr_since ? `<span class="tag">FOR ${dur(Date.now() - lane.herdr_since)}</span>` : ""}${links}</div>
    ${lane.note ? `<div class="note">${linkify(lane.note)}</div>` : ""}
    ${asks.length ? `<div class="row">${asks.map((a) => `<button class="tag lane" data-select="${esc(lane.name)}">ANSWER: ${esc(a.title.slice(0, 40))}${a.title.length > 40 ? "…" : ""}</button>`).join("")}</div>` : ""}`;
}

function renderLog() {
  const notes = S.notes.slice(0, 5).map((n) => `<div><b>${clock(n.at)} YOU</b>${linkify(n.text)} <span style="color:${n.acked_at ? "var(--green)" : "var(--amber)"}">${n.acked_at ? "· HQ has it" : "· not picked up yet"}</span></div>`);
  const answered = S.answered.slice(0, 8).map((a) => `<div><b>${clock(a.answered_at)} ${a.status === "withdrawn" ? "WITHDRAWN" : "ANSWERED"}</b>${esc(a.lane ? a.lane + ": " : "")}${linkify(a.title)} → <strong>${linkify(a.answer)}</strong> <span style="color:${a.acked_at ? "var(--green)" : "var(--amber)"}">${a.status === "withdrawn" ? "" : a.acked_at ? "· HQ acted" : "· HQ to act"}</span></div>`);
  $("log").innerHTML = [...notes, ...answered].join("") || `<div style="color:var(--muted)">Nothing yet today.</div>`;
}

function tick() {
  const now = Date.now();
  for (const el of document.querySelectorAll(".ask")) {
    const age = now - Number(el.dataset.created);
    el.classList.toggle("warm", age > 5 * 60000 && age <= 30 * 60000);
    el.classList.toggle("hot", age > 30 * 60000);
    el.querySelector(".timer").textContent = dur(age);
    const due = Number(el.dataset.due);
    const de = el.querySelector(".due");
    if (due) { de.textContent = due > now ? `DUE ${clock(due)}` : `OVERDUE ${clock(due)}`; de.className = "due" + (due <= now ? " late" : ""); }
  }
}

// ---------- images ----------
// Drop or paste an image into any text box. The image is saved on the HUD's disk and the box gets its path,
// which is how HQ opens it.
const imageFiles = (dt) => [...(dt?.files ?? [])].filter((f) => f.type.startsWith("image/"));
const boxKey = (el) => el.closest?.("[data-ask]")?.dataset.ask ?? "note";
const boxOf = (key) => (key === "note" ? $("noteText") : document.querySelector(`[data-ask="${key}"] textarea`));
function insertAtCaret(ta, text) {
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.setSelectionRange(s + text.length, s + text.length);
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}
async function attachImages(files, key) {
  for (const file of files) {
    try {
      const res = await fetch(`/api/uploads?name=${encodeURIComponent(file.name || "image")}`, { method: "POST", headers: { "content-type": file.type, "x-hud": "1" }, body: file });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      // The box may have been redrawn while the upload ran, so find it again.
      const box = boxOf(key);
      if (box) insertAtCaret(box, `[image: ${data.path}] `);
      else toast("ASK CLOSED. IMAGE SAVED.");
    } catch (err) { toast(err.message); }
  }
}
const clearDropping = () => document.querySelectorAll(".dropping").forEach((el) => el.classList.remove("dropping"));
document.addEventListener("dragover", (e) => {
  if (!imageFiles(e.dataTransfer).length) return;
  e.preventDefault();
  clearDropping();
  boxOf(boxKey(e.target))?.classList.add("dropping");
});
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) clearDropping(); });
document.addEventListener("drop", (e) => {
  clearDropping();
  const files = imageFiles(e.dataTransfer);
  if (!files.length) return;
  e.preventDefault();
  attachImages(files, boxKey(e.target));
});
document.addEventListener("paste", (e) => {
  const files = imageFiles(e.clipboardData);
  if (!files.length) return;
  e.preventDefault();
  attachImages(files, document.activeElement?.tagName === "TEXTAREA" ? boxKey(document.activeElement) : "note");
});

// ---------- events ----------
document.addEventListener("click", (e) => {
  const sel = e.target.closest("[data-select]");
  if (sel) { select(sel.dataset.select, true); return; }
});
$("hud").addEventListener("click", async (e) => {
  const copyBtn = e.target.closest(".copy");
  if (copyBtn) { copyCode(copyBtn); return; }
  const card = e.target.closest("[data-ask]");
  if (!card) return;
  const id = Number(card.dataset.ask);
  const d = drafts.get(id) || {};
  const opt = e.target.closest(".opt");
  if (opt) { d.opt = d.opt === opt.dataset.opt ? undefined : opt.dataset.opt; drafts.set(id, d); renderHud(); return; }
  if (e.target.closest(".send")) {
    const ask = S.open.find((a) => a.id === id);
    const text = (d.text || "").trim();
    const answer = d.opt ? (text ? `${d.opt}. ${text}` : d.opt) : text || (ask.kind === "action" ? "done" : "seen");
    e.target.disabled = true;
    try { await post(`/api/asks/${id}/answer`, { answer }); drafts.delete(id); toast("SENT. HQ HAS IT."); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  }
});
$("hud").addEventListener("input", (e) => {
  const card = e.target.closest("[data-ask]");
  if (!card || e.target.tagName !== "TEXTAREA") return;
  const id = Number(card.dataset.ask);
  const d = drafts.get(id) || {};
  d.text = e.target.value;
  drafts.set(id, d);
  const ask = S.open.find((a) => a.id === id);
  card.querySelector(".send").disabled = !(ask.kind !== "decision" || d.opt || d.text.trim());
});
$("hud").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) e.target.closest("[data-ask]")?.querySelector(".send")?.click();
});
$("compose").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("noteText").value.trim();
  if (!text) return;
  try { await post("/api/notes", { text }); $("noteText").value = ""; toast("SENT TO HQ."); } catch (err) { toast(err.message); }
});
$("noteText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("compose").requestSubmit(); });
// ---------- sound ----------
// Everything is generated in the browser; no audio files. SOUND plays one chime when a new question arrives.
// The setting is remembered in this browser only. The browser needs a click before it allows sound.
const pref = (key, fallback) => { try { const v = localStorage.getItem(key); return v === null ? fallback : v === "1"; } catch { return fallback; } };
const setPref = (key, on) => { try { localStorage.setItem(key, on ? "1" : "0"); } catch {} };
let sound = pref("hq-sound", false);

function ensureAudio() {
  audio = audio || new AudioContext();
  if (audio.state === "suspended") audio.resume();
  return audio;
}
function tone(when, freq, dur, type, vol, dest) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g).connect(dest);
  o.start(when);
  o.stop(when + dur + 0.02);
}

// The chime: three rising notes, the last one held. Plays once per new question, and only then.
function chime() {
  if (!sound || !audio) return;
  const t = audio.currentTime;
  [659, 988, 1319].forEach((f, i) => tone(t + i * 0.09, f, i === 2 ? 0.45 : 0.16, "triangle", 0.12, audio.destination));
}

function renderSoundButtons() {
  $("alerts").textContent = sound ? "SOUND ON" : "SOUND OFF";
}
$("alerts").addEventListener("click", () => {
  sound = !sound;
  setPref("hq-sound", sound);
  if (sound) { ensureAudio(); chime(); }
  renderSoundButtons();
});
// A saved setting may be on from last time; the first click anywhere unlocks audio for it.
document.addEventListener("pointerdown", () => { if (sound) ensureAudio(); }, { once: true });
renderSoundButtons();

function announce() {
  const ids = new Set(S.open.map((a) => a.id));
  if (seenAsks) {
    const fresh = S.open.filter((a) => !seenAsks.has(a.id));
    if (fresh.length) chime();
  }
  seenAsks = ids;
}

// Autoreload: the server stamps index.html's mtime into every state. A new stamp means the file changed.
// Unsent text is parked in sessionStorage so the reload does not eat it.
function keepDrafts() {
  try { sessionStorage.setItem("hq-drafts", JSON.stringify({ drafts: [...drafts], note: $("noteText").value })); } catch {}
}
function restoreDrafts() {
  try {
    const d = JSON.parse(sessionStorage.getItem("hq-drafts") || "null");
    sessionStorage.removeItem("hq-drafts");
    if (!d) return;
    for (const [k, v] of d.drafts) drafts.set(k, v);
    $("noteText").value = d.note || "";
  } catch {}
}
restoreDrafts();

let first = true, pageStamp = null;
async function load() {
  S = await (await fetch("/api/state")).json();
  CONFIG = S.config ?? CONFIG;
  if (pageStamp == null) pageStamp = S.page;
  else if (S.page !== pageStamp) { keepDrafts(); location.reload(); return; }
  announce();
  syncWorkers(first);
  first = false;
  renderStats(); renderHud(); renderCard(); renderLog();
}
function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = () => load().catch(() => {});
}
load().then(connect);
setInterval(() => { if (S) { tick(); renderStats(); } }, 1000);
</script>
